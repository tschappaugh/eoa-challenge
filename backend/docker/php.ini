; Overrides on top of php.ini-production.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; Unset error_log sends errors to stderr (docker logs).
memory_limit = 128M
post_max_size = 64K
upload_max_filesize = 0
file_uploads = Off
allow_url_fopen = Off
session.use_strict_mode = 1
opcache.enable = 1
opcache.validate_timestamps = 0
