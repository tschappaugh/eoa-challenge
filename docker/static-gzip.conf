# Included by the static-file locations in nginx.conf. HTML is always
# compressed once gzip is on; the types below add the built assets. PNG and
# WOFF2 are already compressed, so they are left alone.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript image/svg+xml;
