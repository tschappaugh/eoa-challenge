# Per-IP rate limits. Writes get a much tighter budget; an empty key (reads)
# is not counted by the write zone. Behind Docker Desktop's port forwarding
# all local clients share one address, so locally these limits are global.
map $request_method $api_write_key {
  default "";
  POST $binary_remote_addr;
  PUT $binary_remote_addr;
  PATCH $binary_remote_addr;
  DELETE $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=api_all:10m rate=10r/s;
limit_req_zone $api_write_key zone=api_write:10m rate=30r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    limit_req zone=api_all burst=20 nodelay;
    limit_req zone=api_write burst=10 nodelay;
    client_max_body_size 16k;
    error_page 429 = @rate_limited;

    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_read_timeout 30s;
  }

  # Same JSON error shape the API uses, so the frontend can show it.
  location @rate_limited {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
    default_type application/json;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please wait a minute and try again."}}';
  }

  # Compress static files only. API responses are small, per-user, and
  # no-store, so they are left uncompressed.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/static-gzip.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/static-gzip.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
