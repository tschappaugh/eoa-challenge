name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHPCS, PHPStan, PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gamevoting_test
          MYSQL_USER: gamevoting
          MYSQL_PASSWORD: gamevoting
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Tests connect to "${DB_NAME}_test".
      DB_HOST: 127.0.0.1
      DB_NAME: gamevoting
      DB_USER: gamevoting
      DB_PASSWORD: gamevoting
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Load schema
        run: mysql -h 127.0.0.1 -u gamevoting -pgamevoting gamevoting_test < migrations/001_init.sql
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress
      - run: vendor/bin/phpunit
      - run: composer audit

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        env:
          EOA_API_KEY: placeholder
        run: docker compose --profile test build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repo redaction tests
        run: scripts/test-redact.sh
      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
