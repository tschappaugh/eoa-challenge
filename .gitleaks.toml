# Default gitleaks rules plus a rule for the EOA API key format
# (32 lowercase hex characters assigned to an api_key-like name).
[extend]
useDefault = true

[[rules]]
id = "eoa-api-key"
description = "Essense of Australia code challenge API key"
regex = '''(?i)api[_-]?key["']?\s*[:=]\s*["']?([0-9a-f]{32})\b'''
secretGroup = 1
keywords = ["api_key", "api-key", "apikey"]
